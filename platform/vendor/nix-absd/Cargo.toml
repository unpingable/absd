[package]
name = "nix"
version = "0.29.0"
edition = "2021"
description = "ABSD build substitute for nix 0.29.0, which is `#![cfg(unix)]` and so already empty on ABSD; this crate is that empty crate, built `no_std`"

[lib]
path = "src/lib.rs"

# The feature names of nix 0.29.0, so that dependents' feature requests
# resolve. None enables anything.
[features]
default = []
acct = []
aio = []
dir = []
env = []
event = []
fanotify = []
feature = []
fs = []
hostname = []
inotify = []
ioctl = []
kmod = []
mman = []
mount = []
mqueue = []
net = []
personality = []
poll = []
process = []
pthread = []
ptrace = []
quota = []
reboot = []
resource = []
sched = []
signal = []
socket = []
term = []
time = []
ucontext = []
uio = []
user = []
zerocopy = []
