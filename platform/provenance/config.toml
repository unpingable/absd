# Release-readiness configuration for the ABSD platform (docs/PROVENANCE.md).
# Read by scripts/provenance.py. Edit by hand; keep it small.
#
# Not here: which licence each tracked file is under. That is provenance.toml
# at the repository root, checked by scripts/spdx-check.py
# (docs/SOURCE-LICENSING.md). This file holds the reviewed baseline, the
# policy for third-party dependency licences, and what each artifact contains.

repository = "absd-rust-std"
main = "main"

# The reviewed baseline: the tree the 2026-10-10 audit assessed. "Unchanged
# since the baseline" means unchanged since this commit, at the coverage
# stated below, and nothing stronger.
[baseline]
audit = "audit-20261010"
commit = "b49897b9322156ee8ef82f7daf23409b89e51a7b"
tree = "86a1b90a66b9fe33d1b228f884580b4b4a11fd8a"
limits = [
  "The audit was performed by AI model sessions and challenged by one further AI session. It is not a legal review or an independent human source audit.",
  "Upstream comparison covered kernel driver files against Linux and FreeBSD only; no platform first-party file was compared with any upstream.",
  "Absence of markers or of textual overlap is not evidence of independent creation.",
  "The copyright status of AI-generated code is an open legal question the audit did not resolve.",
]

[[baseline.coverage]]
level = "inventoried"
paths = ["Cargo.lock", "*/Cargo.lock", "pins/*", "vendor/*", "patches/*", "compat/programs.tsv"]
note = "dependency, vendored and patched material read and attributed to an upstream"

[[baseline.coverage]]
level = "outlined"
paths = ["sqlite/*", "ssh/*", "net/*", "scripts/operator_image.py", "scripts/build-*.sh", "scripts/release*.py", "PATCH_AUDIT.md"]
note = "structure, headers and searches inspected to establish what third-party code is used and what is shipped; not read line by line"

[[baseline.coverage]]
level = "keyword-sweep"
paths = ["*"]
note = "searched for licence, copyright and upstream markers only; not read line by line, not compared with any upstream"

# The target the shipped programs are built for (targets/x86_64-unknown-absd.json
# and .cargo/config.toml): used to decide which target-specific dependencies apply.
[target]
triple = "x86_64-unknown-absd"
names = []

[target.values]
target_os = "absd"
target_arch = "x86_64"
target_pointer_width = "64"
target_endian = "little"
target_env = ""
target_vendor = "unknown"
target_feature = ["sse", "sse2"]
target_has_atomic = ["8", "16", "32", "64", "ptr"]
panic = "abort"
getrandom_backend = "rdrand"

# Licences that may be taken without a further decision, in order of
# preference when upstream offers a choice. A component whose terms offer no
# alternative from this list needs an entry under [policy.decisions].
# This list concerns third-party components only. It does not choose a
# licence for ABSD's own code; that decision is open (obligations.toml).
[policy]
prefer = [
  "MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "0BSD", "Zlib",
  "Unicode-3.0", "Unicode-DFS-2016", "Unlicense", "CC0-1.0", "BSL-1.0",
  "Apache-2.0 WITH LLVM-exception",
]

# Path dependencies outside this repository that are the owner's own projects
# (not third-party). Any other outside path is reported as unknown.
owner_projects = ["ag-*", "pulse-*", "nq-*", "nightshift*", "absd-*"]

[policy.decisions]
# component = "licence taken", for anything the preference order cannot settle.

[scan]
# Directories whose binary files the project generates itself (fixtures,
# recorded outputs, test data). New binaries elsewhere need a declaration.
# c/tests/kit/inputs/bytes.bin is first-party random input for the C kit's
# shell-route stdio case; c/vectors/startup/*.bin are the broker's emitted
# startup vectors (see provenance.toml).
binary_ok = ["broker/fixtures/terminal-startup.bin", "fixtures/native-quic/pki/*.der", "fixtures/native-tls/pki/*.der", "fixtures/*", "fs/testdata/*", "compat/data/*", "docs/*", "c/tests/kit/inputs/*", "c/vectors/startup/*", "userland/tar-vectors/basic.ustar", "userland/expected/tee-binary", "userland/expected/paste-nul-parallel", "ssh/enroll-cases/*"]
# Build manifests known to name absolute development paths (obligation
# PORT-ABSOLUTE-PATHS tracks them; new ones elsewhere fail the check).
path_ok = ["Cargo.toml", ".cargo/config.toml"]

# ---------------------------------------------------------------- artifacts
# What a distributed operator image contains (scripts/operator_image.py,
# scripts/build-operator-image.sh): the boot ISO and the disk image.

[[artifact]]
name = "operator-image"
# Distributed: the boot ISO and disk image of a release carry it. Its
# inventory rows used as linked or compiler-input, its components and the
# member tables naming it are the shipped closure the licence gate audits.
distributed = true

  # /bin commands built from the root package. Only the dependencies each
  # installed binary's sources name are counted (the package also carries
  # test programs that pull in SQLite, AG and Pulse; those are not installed).
  [[artifact.unit]]
  name = "commands"
  lock = "Cargo.lock"
  package = "absd-std-probe"
  evidence = "target/x86_64-unknown-absd/release/deps"
  # NATIVE also installs the SSH workspace's absd-sftp. Keep this list
  # scoped to this package; test_operator_provenance_units.py checks the
  # complete installed-program mapping against both Cargo workspaces.
  bins = [
    "absd_sh", "echo", "pwd", "ls", "cat", "printenv", "uname", "mkdir",
    "rm", "mv", "cp", "head", "tail", "wc", "sha256sum", "stat", "df",
    "sync", "man", "date", "uptime", "release", "sysinfo", "health",
    "net-status", "terminal-size", "ps", "interfaces", "dmesg", "logs",
  ]

  # /bin ports: unmodified crates.io programs, one pinned lock each.
  [[artifact.unit]]
  name = "ports"
  ports = "scripts/operator_image.py:PORTS"
  table = "compat/programs.tsv"
  lock = "pins/compat/{crate}-{version}.Cargo.lock"
  # Staging adds the ABSD runtime to each port as a target dependency; the
  # pinned lock carries it, the registry manifest does not.
  roots = ["absd-runtime"]
  evidence = "{root}.staged-compat/target-ports/*/x86_64-unknown-absd/release/deps"
  evidence_exact = true

  # /bin ports in C: the base userland's sbase utilities (userland/README.md),
  # one row each in userland/PORTS.tsv, built from the tarball userland/PIN
  # pins (sha256) with the declared patches (provenance.toml) and statically
  # linked with the C kit. Each is listed as <upstream>-<name>, under the
  # upstream's licence; the notice is the upstream LICENSE kept verbatim.
  # Their names are skipped by the crate ports unit above.
  [[artifact.unit]]
  name = "userland-ports"
  c_ports = "userland/PORTS.tsv"
  pin = "userland/PIN"
  # Toybox's diff and hexdump copies carry the same upstream LICENSE bytes.
  # Select by pinned upstream; never copy both upstreams into every port.
  notice_files = { "sbase-0.1" = ["userland/sbase.LICENSE"], "toybox-0.8.15" = ["userland/diff/LICENSE"] }

  # The SSH workspace: sshd and the file server in the boot ISO, and the
  # absd-sftp worker installed on disk. This unit covers the whole package.
  [[artifact.unit]]
  name = "sshd"
  lock = "ssh/Cargo.lock"
  package = "absd-sshd"
  # ssh/ names the tree's crates through ssh/tree/ links that
  # scripts/stage-ssh.sh makes; the tree's own workspace finds them where the
  # links are not made yet.
  manifest_dir = ["ssh", "."]
  evidence = "ssh/target/x86_64-unknown-absd/release/deps"
  evidence_exact = true

  # The Rust standard library as built for the target (-Z build-std with
  # build-std-features = optimize_for_size; the std patch removes the default
  # panic-unwind feature). Sources are the pinned toolchain's rust-src.
  [[artifact.unit]]
  name = "std"
  lock = "pins/library.Cargo.lock"
  package = "std"
  features = ["optimize_for_size"]
  roots = ["panic_abort"]
  sources = "~/.rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu/lib/rustlib/src/rust/library"
  manifest_dir = "std"
  source_id = "rust-src 1.95.0 with patches/rust-1.95.0-absd-std.patch"
  linked_source_notes = { compiler_builtins = "toolchain library/compiler-builtins/libm (manifest version 0.2.16; not a content-equivalence claim with the registry crate)" }
  notice_files = [
    "~/.rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu/share/doc/rust/COPYRIGHT-library.html",
    "~/.rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu/share/doc/rust/licenses",
  ]

  # Not Rust dependencies: placed on the ISO by the host's grub-mkrescue.
  [[artifact.component]]
  name = "GRUB"
  version = "host package grub-common"
  origin = "host-package"
  license = "GPL-3.0-or-later"
  use = "included"
  source = "boot images, modules and locale catalogues copied by grub-mkrescue"
  notice_files = ["/usr/share/doc/grub-common/copyright", "/usr/share/common-licenses/GPL-3"]
  actions = [
    "GPL-3.0: distributing the ISO distributes GRUB binaries; corresponding source for the exact host package build must be offered or accompany it. A notice bundle does not do this.",
    "Record the host package version (dpkg-query -W grub-common grub-pc-bin grub-efi-amd64-bin) with the release; it is not pinned by this repository.",
  ]

  [[artifact.component]]
  name = "GNU Unifont"
  version = "15.1.01"
  origin = "host-package"
  # Owner election, 2026-10-19, for the exact font identified below. Upstream
  # COPYING and the compiled font's copyright offer OFL-1.1 as an alternative
  # to GPL-2.0-or-later with the font embedding exception. This component's
  # declared terms record the elected alternative, not terms for its tools.
  license = "OFL-1.1"
  use = "included"
  source = "Unifont 15.1.01 font/precompiled/unifont-15.1.01.pcf.gz, converted by grub-mkfont 2.12-1ubuntu7.3; unicode.pf2 2411806 bytes, SHA256 662eb86fc1ea89635e4bba8413590b79eb714ade5a2b5a5aa3dc5cf5f53a4463"
  notice_files = ["provenance/boot-font/unifont-15.1.01.NOTICE", "LICENSES/OFL-1.1.txt"]
  actions = [
    "OFL-1.1 election applies to the exact 15.1.01 font identified here. Verify each release's actual ISO font against this size and SHA256; changed font bytes require a new source and licence eligibility check before reusing this record.",
    "Distribute the font's copyright notice and the full OFL-1.1 text. Do not apply this font election to Unifont's non-font programs or documentation, and retain OFL conditions for modified fonts and reserved names.",
  ]

  # The C kit's link inputs for the C ports in /bin (unit userland-ports):
  # c/bin/absd-cc links crt0, libabs, Picolibc's libc.a and libm.a, the Rust
  # compiler_builtins member and clang's builtins archive into each port.
  # These rows are declared because no Cargo lock reaches them (the c-kit
  # runtime unit is unlisted). Inclusion is recorded from retained link maps,
  # not from a per-symbol proof.
  # Named as the member table names it, so that the notice bundle has one
  # picolibc-1.8.12/ directory (NOTICES.txt and COPYING.picolibc).
  [[artifact.component]]
  name = "picolibc"
  version = "1.8.12"
  origin = "upstream-tarball"
  # Its licence is the member table's: the consumed rows' expressions, each
  # judged per linked member there. The gate fails if the two disagree.
  member_table = "c/picolibc/PROVENANCE.tsv"
  license = "(Apache-2.0 OR BSL-1.0) AND Apache-2.0 WITH LLVM-exception AND BSD-2-Clause AND BSD-3-Clause AND LicenseRef-picolibc-FreeBSD-1 AND LicenseRef-picolibc-Other-1 AND LicenseRef-picolibc-Other-15 AND LicenseRef-picolibc-Other-16 AND LicenseRef-picolibc-Other-4 AND LicenseRef-picolibc-Other-5 AND LicenseRef-picolibc-UCB-1 AND LicenseRef-picolibc-UCB-2 AND SunPro"
  use = "linked"
  source = "c/picolibc/PIN picolibc-1.8.12.tar.xz sha256:64e8c412e1c40fa6eb1a72d2b5cdbcbfe6ceca4cbea454edbad54557ffc747fa (libc.a sha256:7924073af8c975a4d623917070cbe098276632f0e332accfd82e11cdb7975f20); libc.a members linked into all 12 userland/PORTS.tsv ports by c/bin/absd-cc"
  notice_files = ["provenance/linked-notices/picolibc-1.8.12/COPYING.picolibc"]
  actions = [
    "Carry COPYING.picolibc (verbatim from the pinned archive) with any image whose /bin holds a C port. It is the upstream aggregate; it also names files ABSD does not build (GPL-2.0 test-printf sources, excluded by -Dtests=false, and the AGPL-3.0 GeneratePicolibcCrossFile.sh script, unused), which are not part of any shipped object.",
  ]

  [[artifact.component]]
  name = "LLVM compiler-rt builtins"
  version = "clang 18 (host package libclang-rt-18-dev)"
  origin = "host-package"
  license = "Apache-2.0 WITH LLVM-exception"
  use = "compiler-input"
  source = "libclang_rt.builtins-x86_64.a from clang -print-resource-dir, last on the c/bin/absd-cc link line; the retained RC2-source link maps select no member of it in any of the 12 ports"
  notice_files = ["cxx/llvm-project.LICENSE"]
  actions = [
    "Listed conservatively because its archive is on the C link line. If a later link map selects a member, the LLVM licence text here applies to that binary; the text is LLVM's llvmorg-18.1.8 LICENSE.TXT, the same project licence as the host package build.",
  ]

  # Intel's BSD-3-Clause notice for the kernel's I219 driver (src/i219.rs is
  # compiled into the shipped kernel). The kernel's own notice generator
  # lists the action without the text (kernel obligation I219-ON-MERGE), so
  # this image's notices carry the verbatim header, copied from the kernel
  # candidate named in source. A changed kernel header needs a fresh copy.
  [[artifact.component]]
  name = "Intel e1000 shared code (kernel I219 driver)"
  version = "FreeBSD 833d39bd2e38421a14ea489a956261a0fa993fbc"
  origin = "kernel-adapted"
  license = "BSD-3-Clause"
  use = "included"
  source = "absd-kernel 101c61d82534b8c25b7295eb5a2fcd0e72cc5b3a src/i219.rs, adapted from e1000_ich8lan.c, e1000_phy.c and if_em.c; header lines 1-33 copied verbatim"
  notice_files = ["provenance/kernel-notices/i219-intel-BSD-3-Clause.NOTICE"]
  actions = [
    "BSD-3-Clause clause 2: reproduce Intel's notice (the header of kernel src/i219.rs, carried here verbatim) with any image whose kernel contains the I219 driver.",
  ]

  # Built and audited in the kernel repository: the paired-audit record
  # states that repository's distribution gate result for the commit it names.
  [[artifact.component]]
  name = "ABSD kernel and init"
  version = "kernel repository, pinned commit"
  origin = "first-party"
  cross_repository = "absd-kernel"
  paired_artifact = "kernel-image"
  incorporated_commit = "1a44e3c207e514e1f776f3d745d62eb870d0c608"
  paired_audit = "provenance/paired/kernel-image.toml"
  license = ""
  use = "included"
  source = "see the kernel repository's provenance/inventory/kernel-image.tsv for its third-party content (Rust core/alloc, console font)"
  notice_files = []

# Programs built only for the test matrices (NQ, AG, Pulse, Nightshift and
# their probes). Not distributed and not inventoried crate by crate; listed
# so that the notices their sources carry are not lost if one ever ships.
# The in-tree material that goes into them is in provenance.toml
# (in-artifacts = ["workload-images"]).
[[artifact]]
name = "workload-images"
inventoried = false
# Test programs, never distributed: repository inventory, not the closure.
distributed = false

  # The extended integration programs (integration/): test programs that run
  # Pulse and AG code on ABSD. Never installed on an operator image; like
  # the rest of this artifact, not inventoried crate by crate.
  # The C kit's runtime staticlib (c/absd-c: absd-runtime with the c-entry
  # feature, built by scripts/build-c-kit.sh into libabs.a). Linked only into
  # programs a developer builds with absd-cc; no distributed artifact contains
  # it. Its registry crates are the root package's runtime dependencies,
  # inventoried for the operator image.
  [[artifact.unit]]
  name = "shell-host-workflows"
  lock = "sh/Cargo.lock"
  listed = false
  note = "Standalone production-AST/executor host tests; no host binary ships. Native shell dependencies are inventoried under the operator-image commands unit in Cargo.lock."

  [[artifact.unit]]
  name = "health-observation-host-tests"
  lock = "tests/Cargo.lock"
  listed = false
  note = "Host-only conformance harness for the health JSON projection; no binary or library from this standalone test workspace ships. Native health uses the root package's already inventoried serde_json, FSD and release dependencies."

  [[artifact.unit]]
  name = "c-kit-runtime"
  lock = "c/absd-c/Cargo.lock"
  listed = false
  note = "the kit runtime ships in no artifact; developers link it into their own programs with absd-cc, and its crates are the root package's runtime dependencies already inventoried under operator-image"

  [[artifact.unit]]
  name = "integration-programs"
  lock = "integration/Cargo.lock"
  listed = false
  note = "resolving it needs the Pulse and AG sources, which a checkout of this repository alone does not have; the programs are test programs and are never distributed"

  [[artifact.unit]]
  name = "native-markdown-probe"
  lock = "pins/native-app/pulldown-cmark-0.13.4.Cargo.lock"
  listed = false
  note = "opt-in unchanged-source application fixture only; neither the application nor this lock is installed in an operator image or distributed artifact; distribution would require a separate dependency inventory and review"

  [[artifact.unit]]
  name = "native-tls-fixture"
  lock = "tls/Cargo.lock"
  listed = false
  note = "Private source-admitted native HTTPS fixture, excluded from operator_image.py:NATIVE. This non-inventoried workload unit does not licence-check its closure; the separately reviewed resolved checksum, target, feature and licence manifest is required before build. Generated public DER inputs are sealed separately from tracked source."

  [[artifact.unit]]
  name = "native-quic-fixture"
  lock = "quic/Cargo.lock"
  listed = false
  note = "Private source-admitted QUICv1 client and granting fixture, excluded from the operator image. A separately inspected actual-target package, feature, checksum, notice and entropy closure is required before build; no execution acceptance follows from this workload declaration. Reuses only the unchanged admitted TLS ring adaptation."

  [[artifact.component]]
  name = "Pulse (constellation-monitor)"
  version = "public cut at 81c2354"
  origin = "owner-project"
  license = "Apache-2.0"
  use = "included"
  source = "the owner's project, published under Apache-2.0 with a NOTICE file; built with patches/pulse-*.patch"
  notice_files = ["provenance/upstream-notices/pulse.NOTICE", "LICENSES/Apache-2.0.txt"]
  actions = ["Apache-2.0 section 4(d): carry the NOTICE text and the licence with any image or source tree that includes the Pulse programs."]

  [[artifact.component]]
  name = "Nightshift"
  version = "e2675dd"
  origin = "owner-project"
  license = "Apache-2.0"
  use = "included"
  source = "the owner's project, Apache-2.0 with a NOTICE file; built with patches/nightshiftd-absd.patch"
  notice_files = ["provenance/upstream-notices/nightshift.NOTICE", "LICENSES/Apache-2.0.txt"]
  actions = ["Apache-2.0 section 4(d): carry the NOTICE text and the licence with any image or source tree that includes the Nightshift programs."]

  [[artifact.component]]
  name = "AG"
  version = "21c8da0"
  origin = "owner-project"
  license = "Apache-2.0"
  use = "included"
  source = "the owner's project, Apache-2.0, no NOTICE file; built with patches/ag-*.patch"
  notice_files = ["LICENSES/Apache-2.0.txt"]

  [[artifact.component]]
  name = "NQ"
  version = "8057441"
  origin = "owner-project"
  license = "Apache-2.0"
  use = "included"
  source = "the owner's project, Apache-2.0, no NOTICE file; built with patches/nq-absd.patch"
  notice_files = ["LICENSES/Apache-2.0.txt"]

# The published website is described by its own audit baseline. Its
# deployment is not coupled to these checks.
[website]
statement = "absd.dev was audited at main 52290eb / gh-pages 4cd4e67 (audit-20261010): no blocking finding. It describes ABSD and distributes none of it, so OS licensing decisions do not gate it. Site wording that depends on OS facts is listed below."

# Activated only by `provenance.py notices operator-image-document` with
# explicit release, native AppA receipt and actual-target dep-info inputs.
# It never changes the default operator-image inventory or `update` output.
[document_application]
artifact = "operator-image-document"
base = "operator-image"
binary = "tree/bin/https-document"

[document_application.unit]
name = "https-document"
lock = "tls/Cargo.lock"
manifest_dir = "tls"
package = "absd-native-tls-fixture"
# The application calls this package's library as well as its direct deps.
# Resolve the complete library roots, not a textual binary-only projection.
features = []

# ---------------------------------------------------------------- licence policy
# The standing licence-policy gate (docs/PROVENANCE.md, "Licence policy gate"),
# run by `provenance.py check` and `full`. Owner policy 2026-10-19: code
# distributed as part of ABSD is permissive only and never LGPL-derived;
# derived code is never labelled Apache-2.0. Owner 2026-10-29: a standing
# process for auditing code by licence. Every licence the records name
# (provenance.toml rules, lock closures, image components, pins, and tags or
# wording in tracked files) must be on `allowed`, or be taken from an OR whose
# alternative is, or be covered by a named exception. A recorded `decision`
# in provenance.toml does not waive it. Keep this table identical to the
# kernel repository's, except for paths.
# Owner 2026-11-05 (integration steward): accept SPDX blessing for the pinned
# SQLite core, whose exact dedication the platform carries as
# LICENSES/blessing.txt (sha256 06545a6ec25fbbff6c62f205f94a35be49e38f33bea827a8cfb07d7b82e4b083).
# This adds one identifier; other terms and the sqlite-src mixed tree stay unchanged.
[licence_policy]
# Each entry is permissive and used by one of the two repositories today
# (as of 2026-10-29); the comment names a user. Add one only with a user.
allowed = [
  "MIT",               # most crates; sbase (userland/PIN)
  "Apache-2.0",        # ABSD first-party; Rust std; crates; the owner's projects
  "BSD-3-Clause",      # curve25519/ed25519/x25519-dalek, subtle, encoding_rs; kernel src/i219.rs (Intel)
  "BSD-2-Clause",      # Picolibc headers and sources linked into the userland ports (c/picolibc/PROVENANCE.tsv)
  "ISC",               # ring (with Apache-2.0), rustls-webpki, untrusted, is_ci
  "0BSD",              # smoltcp, managed, sunset; Toybox diff and hexdump
  "Zlib",              # foldhash, zlib-rs
  "blessing",          # SQLite 3.54.0 core and carried clock context; owner 2026-11-05
  "Unicode-3.0",       # icu_* and the zerovec family
  "Unicode-DFS-2016",  # unicode-ident 1.0.13 (with MIT OR Apache-2.0)
  "BSL-1.0",           # clipboard-win, error-code (Boost Software License)
  "Apache-2.0 WITH LLVM-exception",  # compiler_builtins, wasi crates, llvm-project (cxx/PIN), libc++ in the C++ kit
  "LicenseRef-font-misc-misc-public-domain",  # kernel console font (X.Org misc-fixed 8x13) and its component record
]
# Copyleft and source-available families, by SPDX id glob. A term here fails
# even inside an OR, unless another alternative is allowed (that one is then
# taken and the run lists it). WITH never rescues a denied licence. Weak
# copyleft fails by default too. Anything not on `allowed` fails anyway; this
# list names why.
denied = [
  "GPL-*", "LGPL-*", "AGPL-*", "SSPL-*", "EUPL-*", "OSL-*", "CPAL-*", "RPL-*", "RPSL-*", "Sleepycat",
  "MPL-*", "EPL-*", "CDDL-*", "GFDL-*", "CC-BY-SA-*", "CC-BY-NC-*",
]

# Permissive terms awaiting the owner's acceptance would be listed here as
# [[licence_policy.pending]]: each fails the distribution audit as "pending
# owner acceptance" until the owner decides. None is pending.
# Terms the owner accepted for one member table only (decision 2026-10-29,
# record PICOLIBC-LICENCE-TEXTS.md in the latest-integration lane): bound to
# the table, Picolibc 1.8.12 and the pinned tarball's sha256; nowhere else.
# Their conditions are checked against the linked members on every run (the
# table's notice and acknowledgements) and recorded in
# provenance/obligations.toml (LIC-PICOLIBC-NOTICES).
[[licence_policy.accepted]]
licence = "LicenseRef-picolibc-Other-1"
member_table = "c/picolibc/PROVENANCE.tsv"
name = "picolibc"
version = "1.8.12"
source_sha256 = "64e8c412e1c40fa6eb1a72d2b5cdbcbfe6ceca4cbea454edbad54557ffc747fa"
conditions = "preserve this notice: the exact licence text and each linked file's copyright notice in the distribution notices (c/picolibc/NOTICES.txt)"
decision = "Owner, 2026-10-29: accepted on conditions (PICOLIBC-LICENCE-TEXTS.md, latest-integration-20261029 lane)"

