# Only in the lane-owned isolated Linux VM/network namespace.
interface=dhcp-tap0
bind-interfaces
listen-address=192.0.2.1
user=root
no-resolv
no-hosts
local=/example/
address=/a.example/198.51.100.9
dhcp-authoritative
dhcp-range=192.0.2.100,192.0.2.100,255.255.255.0,120s
dhcp-host=52:54:00:12:34:56,192.0.2.100,absd-dhcp,120s
dhcp-ignore=tag:!known
dhcp-option=option:router,192.0.2.1
dhcp-option=option:dns-server,192.0.2.1
dhcp-lease-max=1
log-dhcp
log-queries
keep-in-foreground
