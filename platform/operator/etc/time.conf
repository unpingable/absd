# Read at sshd startup. Missing or enabled no means no outgoing time query.
# Estimates remain unauthenticated; RTC/TLS trust and monotonic deadlines do not change.
enabled no
# Select a specific private or public unicast peer before enabling:
# server 10.0.2.2
server-port 123
local-port 49123
interval-seconds 3600
max-step-seconds 86400
max-age-seconds 21600
