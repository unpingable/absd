# /etc/network.conf: the address sshd's network stack takes at start.
# network.conf(5). These are QEMU's user network (-netdev user): the
# guest 10.0.2.15/24 and QEMU's gateway 10.0.2.2. A malformed file stops
# sshd from starting; a missing one means these same values.
address 10.0.2.15
netmask 255.255.255.0
gateway 10.0.2.2
