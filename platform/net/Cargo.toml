[package]
name = "absd-net"
version = "0.1.0"
edition = "2024"
description = "Native IPv4, IPv6 datagrams and TCP over the kernel's NIC frame calls"

[features]
dhcpv4 = ["smoltcp/socket-dhcpv4"]

[dependencies]
smoltcp = { version = "=0.14.0", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "auto-icmp-echo-reply",
] }

[target.'cfg(target_os = "absd")'.dependencies]
absd-runtime = { path = "../runtime" }

[lib]
doctest = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("absd"))'] }
