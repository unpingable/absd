[package]
name = "absd-runtime"
version = "0.1.0"
edition = "2024"

[lib]
test = false
doctest = false


[dependencies]
absd-broker = { path = "../broker" }
absd-fs = { path = "../fs" }
absd-fsd = { path = "../fsd" }
absd-release = { path = "../release" }

[features]
# The C kit's entry: route `main` through a C-defined `__absd_program_main`
# with a NULL-terminated envp. Off for every Rust executable.
c-entry = []

native-pcm-experiment = ["absd-broker/native-pcm-experiment"]

# Private SSH demo: one exact Doom child may receive the boot grant.
native-pcm-delegate = ["native-pcm-experiment"]
