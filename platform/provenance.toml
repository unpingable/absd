# File-level provenance and licensing inventory for the platform repository.
# Convention and field meanings: docs/SOURCE-LICENSING.md.
# Checked by scripts/spdx-check.py. The last rule that matches a path wins.
#
# First-party ABSD source is Apache-2.0 (owner decision 2026-10-10). `pending`
# remains the value for anything whose licence is undecided: it is not a
# grant, a public-domain dedication, or a statement that no copyright exists.
#
# Linked registry crates are not listed here. Their licences and notices are
# the release tooling's dependency inventory.

version = 1

# First-party source, build inputs, tests, fixtures and records written for
# ABSD. Named roots only: a new top-level directory is unclassified until
# someone says what it is.
[[files]]
path = [
    "*",
    ".cargo/**",
    "broker/**",
    "compat/**",
    "docs/**",
    "durable/**",
    "integration/**",
    "fixtures/**",
    "fs/**",
    "fsd/**",
    "man/**",
    "media/**",
    "net/**",
    "observe/**",
    "operator/**",
    "perf/**",
    "provenance/**",
    "release/**",
    "runtime/**",
    "scripts/**",
    "sh/**",
    "sqlite/**",
    "src/**",
    "ssh/**",
    "targets/**",
    "tls/**",
    "quic/**",
    "tests/**",
    "tools/**",
    "vendor/README.md",
]
class = "first-party"
license = "Apache-2.0"

# The C application kit (c/: libabs, the POSIX adapter, absd-cc, headers,
# tests and vectors) and the Stage 2 port harness (cports/), written for ABSD
# by the C ecosystem campaign (docs/c-ecosystem-20261010). Lua, zlib, SQLite
# and Picolibc are downloaded and verified by hash at build time
# (cports/programs.tsv, c/picolibc/PIN), never vendored; only ABSD's own
# build glue, expectations and records live here.
[[files]]
path = ["c/**", "cports/**"]
class = "first-party"
license = "Apache-2.0"

# The enrollment key cases (coordination record #31 slice A): authorized_keys inputs
# written for ABSD, each named for its verdict, that both the enroll worker's
# unit test and the helper's test read. Some are deliberately not text (NUL,
# form feed, non-ASCII). The keys are made-up ed25519 blobs of repeated bytes.
[[files]]
path = "ssh/enroll-cases/*.keys"
class = "first-party"
license = "Apache-2.0"

# Startup-record vectors: bytes the broker's encoder emits for the C kit's
# contract tests (broker/src/tests.rs, emit_startup_vectors, written only
# when ABSD_EMIT_VECTORS names the directory).
[[files]]
path = ["c/vectors/startup/*.bin", "c/vectors/startup/*.json"]
class = "generated"
generator = "broker/src/tests.rs emit_startup_vectors (cargo test with ABSD_EMIT_VECTORS)"
license = "Apache-2.0"

# Exact encoder bytes shared with the kernel startup conformance test.
[[files]]
path = ["broker/fixtures/terminal-startup.bin", "broker/fixtures/terminal-startup.json"]
class = "generated"
kind = "generated"
generator = "broker/src/tests.rs terminal_startup_shared_golden (encode_startup)"
origin = "Synthetic first-party startup encoding; shared with kernel tests/fixtures/terminal-startup.bin, not an executable"
license = "Apache-2.0"

# Demand records of the Stage 2 ports: the symbols the upstream programs'
# objects require (nm), what is left after a trial link against Picolibc,
# and the compiler's diagnostics over the staged upstream sources named in
# cports/programs.tsv. The .undef/.residual lists are symbol names only; the
# compile logs are clang diagnostics, which quote the offending upstream
# source lines (Lua 5.4.9 MIT, SQLite public domain) and the campaign
# checkout path archived-occurrence — short
# excerpts carried as diagnostics, not redistributed upstream sources.
[[files]]
path = ["cports/demand/*.undef.txt", "cports/demand/*.residual.txt", "cports/demand/*.compile.log"]
class = "generated"
generator = "cports/demand/collect.sh (clang -c, nm -u and a trial link over the staged upstream sources)"
license = "Apache-2.0"

# The base userland (userland/: the pin, the build glue, per-port patches,
# demand records, expectations), written for ABSD by the base-userland lane
# (DIRECTIVE-base-userland-20261012). As for Picolibc under c/**, the upstream
# (sbase, MIT) is downloaded and verified by hash at build time
# (userland/PIN, scripts/stage-userland.sh) and extracted beside the
# repository, never vendored; only ABSD's own glue and records live here.
[[files]]
path = "userland/**"
class = "first-party"
license = "Apache-2.0"

# Byte-stream regression output, including NUL bytes copied from the
# first-party bin.dat fixture in scripts/check-userland.py.
[[files]]
path = "userland/expected/tee-binary"
class = "generated"
generator = "scripts/check-userland.py --update (pinned sbase tee host reference, cases.tsv tee-binary, FIXTURES bin.dat bytes(range(0, 40)))"
license = "Apache-2.0"

# Demand records of the base userland: symbol names each sbase utility's
# objects require, their bucket and resolution, and per-utility compile/link/
# gate outcomes; compile failures are quoted as one clang diagnostic line
# naming an sbase file and line (no upstream source text beyond that line).
[[files]]
path = ["userland/DEMAND.tsv", "userland/DEMAND-SUMMARY.tsv"]
class = "generated"
generator = "scripts/userland-demand.py (absd-cc compile, nm, trial link and check-c-elf.py over the staged sbase tree named in userland/PIN)"
license = "Apache-2.0"

# The C++0 runtime lane (native-Clang campaign, DIRECTIVE-native-clang-20261012,
# task T1): the pin, the CMake toolchain, the absd-c++ driver, the probe, its
# expected output and the host check are first-party. As for Picolibc under
# c/**, the upstream (LLVM 18.1.8: libc++, libc++abi, and later Clang and LLD;
# Apache-2.0 WITH LLVM-exception) is downloaded and verified by hash
# (cxx/PIN, scripts/stage-llvm.sh), extracted beside the repository and built
# there (scripts/build-cxx-runtime.sh), never vendored; the archives and
# headers it produces live outside the tree. A program absd-c++ links carries
# libc++/libc++abi object code; the LLVM exception waives the notice
# conditions (4(a), 4(b), 4(d)) for such embedded portions.
[[files]]
path = "cxx/**"
class = "first-party"
license = "Apache-2.0"

# LLVM's own LICENSE.TXT, verbatim, kept beside the pin so a source or image
# tree that carries libc++/libc++abi (or their headers) can carry it
# (scripts/stage-llvm.sh refuses a staged tree whose LICENSE.TXT differs).
[[files]]
path = "cxx/llvm-project.LICENSE"
class = "imported"
origin = "llvm-project 18.1.8 (cxx/PIN), LICENSE.TXT"
license = "Apache-2.0 WITH LLVM-exception"

# The LLVM-on-the-kit port (task T2, cxx/README.md "LLVM on the kit"): the
# declared patches against the pinned llvm-project 18.1.8, applied to a build
# copy outside the tree by scripts/build-llvm-kit.sh. Each patch's context
# and removed lines are LLVM's, its added lines first-party.
[[files]]
path = "cxx/patches/llvm/*.patch"
class = "adapted"
origin = "llvm-project 18.1.8 (cxx/PIN): libcxx/src, llvm/lib/Support, llvm/lib/TargetParser, llvm/lib/Passes, clang/lib/Frontend, lld"
upstream-license = "Apache-2.0 WITH LLVM-exception"
upstream-notice = "The LLVM project contributors (LLVM Project, llvmorg-18.1.8), cxx/llvm-project.LICENSE"
license = "Apache-2.0 WITH LLVM-exception"

# The ABSD OS layer of LLVMSupport, copied into the build copy as
# lib/Support/ABSD/*.inc: written for the kit, in LLVM's Unix/*.inc shape,
# with findProgramByName and writeFileWithEncoding (Program.inc) and the
# Watchdog and Memory signatures kept from LLVM's Unix/ files.
[[files]]
path = "cxx/glue/llvm-support/*.inc"
class = "adapted"
origin = "llvm-project 18.1.8 (cxx/PIN): llvm/lib/Support/Unix/{Signals,Program,Memory,Watchdog}.inc"
upstream-license = "Apache-2.0 WITH LLVM-exception"
upstream-notice = "The LLVM project contributors (LLVM Project, llvmorg-18.1.8), cxx/llvm-project.LICENSE"
license = "Apache-2.0 WITH LLVM-exception"

# The symbol names Picolibc 1.8.12's libc.a and libm.a define (nm), kept so
# that demand tables can be classified without the install present. The
# upstream is Picolibc 1.8.12 under BSD-style licences (its COPYING.picolibc:
# mostly BSD-3-Clause, with BSD-2-Clause and MIT parts); the list carries
# symbol names only, and BSD-3-Clause is the single SPDX value that covers
# the archives it was read from (campaign controller, 2026-10-12).
[[files]]
path = "cports/demand/picolibc-1.8.12-defined.txt"
class = "generated"
generator = "cports/demand/collect.sh (nm --defined-only over the pinned Picolibc 1.8.12 archives; c/picolibc/PIN)"
origin = "picolibc 1.8.12 (symbol names only, from its built archives)"
upstream-license = "BSD-3-Clause"
license = "Apache-2.0"

[[files]]
path = ["Cargo.lock", "**/Cargo.lock", "pins/**"]
class = "generated"
generator = "cargo, from the first-party manifests and the staged upstream trees"
license = "Apache-2.0"

[[files]]
path = ["provenance/inventory/**", "provenance/baseline/**"]
class = "generated"
generator = "scripts/provenance.py update"
license = "Apache-2.0"

