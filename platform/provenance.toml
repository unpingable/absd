class = "imported"
origin = "constellation-monitor public cut at 81c2354, NOTICE"
license = "Apache-2.0"

[[files]]
path = "provenance/upstream-notices/nightshift.NOTICE"
class = "imported"
origin = "Nightshift at e2675dd, NOTICE"
license = "Apache-2.0"

# A private key kept as a test fixture. scripts/provenance.py refuses any
# other credential-shaped file. It is the Ed25519 key whose seed is SHA-256
# of the string "ABSD test fixture key, not a credential", derived by
# scripts/reference_fixture.py (fixtures/ag-native/README.md): anyone can
# derive it, so it is public by construction and must never be enrolled
# anywhere. Its enrollment is a stub and the matrix that uses it never signs.
# It replaced, on 2026-10-10, a key openssl had generated at random for the
# first reference run (commit 000e2c1d), whose use on other hosts could not
# be ruled out; that key remains in the development repository's history
# and is in no source release.
[[files]]
path = "fixtures/ag-native/reference/i-fresh-ag/ag/secrets/**"
class = "first-party"
license = "Apache-2.0"
kind = "test-key"

