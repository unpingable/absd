# Intel's BSD-3-Clause notice from the kernel's I219 driver, carried verbatim
# so the operator-image notices reproduce it (kernel obligation I219-ON-MERGE;
# BSD-3-Clause clause 2). The kernel source is unchanged; this is a copy of
# lines 1-33 of src/i219.rs at kernel 101c61d82534b8c25b7295eb5a2fcd0e72cc5b3a.
[[files]]
path = "provenance/kernel-notices/i219-intel-BSD-3-Clause.NOTICE"
class = "imported"
origin = "absd-kernel 101c61d82534b8c25b7295eb5a2fcd0e72cc5b3a, src/i219.rs lines 1-33 (Intel's header, from FreeBSD sys/dev/e1000 at 833d39bd2e38421a14ea489a956261a0fa993fbc)"
license = "BSD-3-Clause"
notice-files = ["LICENSES/BSD-3-Clause.txt"]

# Picolibc's upstream aggregate copyright file, carried verbatim as the
# picolibc component's notice (provenance/config.toml). It states the terms of
# every upstream file, including files ABSD neither builds nor ships (GPL-2.0
# test sources, the AGPL-3.0 scripts/GeneratePicolibcCrossFile.sh); the
# linked members' terms are c/picolibc/PROVENANCE.tsv's. The file's own terms
# are its "Files: *" paragraph, label Default-1, reviewed as BSD-3-Clause in
# c/picolibc/LICENCE-LABELS.tsv. Its wording is a verbatim upstream notice
# exemption pinned by sha256 ([licence_policy] marker_exempt). As a COPYING
# file it is licence metadata to spdx-check (no REUSE annotation needed, and
# this rule is reported unused there); scripts/provenance.py reads the rule.
[[files]]
path = "provenance/linked-notices/picolibc-1.8.12/COPYING.picolibc"
class = "imported"
origin = "picolibc 1.8.12 (c/picolibc/PIN, picolibc-1.8.12.tar.xz sha256 64e8c412e1c40fa6eb1a72d2b5cdbcbfe6ceca4cbea454edbad54557ffc747fa), member picolibc-1.8.12/COPYING.picolibc (sha256 80a8d14adb2548513e9e86803bbc4b3c97423533efcea8e04fe9814996fb2974): the upstream aggregate copyright notice"
license = "BSD-3-Clause"
notice-files = ["LICENSES/BSD-3-Clause.txt"]

# A private key kept as a test fixture. scripts/provenance.py refuses any
# other credential-shaped file. It is the Ed25519 key whose seed is SHA-256
# of the string "ABSD test fixture key, not a credential", derived by
# scripts/reference_fixture.py (fixtures/ag-native/README.md): anyone can
# derive it, so it is public by construction and must never be enrolled
# anywhere. Its enrollment is a stub and the matrix that uses it never signs.
# It replaced, on 2026-10-10, a key openssl had generated at random for the
# first reference run (commit 000e2c1d), whose use on other hosts could not
# be ruled out; that key remains in the development repository's history
# and is in no source release.
[[files]]
path = "fixtures/ag-native/reference/i-fresh-ag/ag/secrets/**"
class = "first-party"
license = "Apache-2.0"
kind = "test-key"

# Credential-shaped text exists only as a negative fixture: the archive writer
# must reject it. No key is generated, enrolled or used for authentication.
[[files]]
path = "scripts/test_app_a_vm_runner.py"
class = "first-party"
license = "Apache-2.0"
kind = "test-key"

