version = 1

# REUSE annotations for files whose licensing is established and which cannot
# carry a header of their own. Convention: docs/SOURCE-LICENSING.md.
#
# Upstream's own statements, and one annotation for first-party ABSD files.
# First-party files carry no copyright line, so this repository does not
# pass `reuse lint` and does not claim REUSE compliance.

# First-party ABSD source: Apache-2.0 (owner decision 2026-10-10,
# docs/SOURCE-LICENSING.md). Files carry no header; this annotation and
# provenance.toml are the record. Later, more specific annotations win.
[[annotations]]
path = "**"
SPDX-License-Identifier = "Apache-2.0"

# tempfile 3.27.0. The copyright line is the one in upstream's LICENSE-MIT;
# two files also keep their own "The Rust Project Developers" notices.
# src/file/imp/absd.rs is an ABSD addition and is deliberately not listed.
[[annotations]]
path = [
    "vendor/tempfile/*",
    "vendor/tempfile/src/*.rs",
    "vendor/tempfile/src/dir/**",
    "vendor/tempfile/src/file/mod.rs",
    "vendor/tempfile/src/file/imp/mod.rs",
    "vendor/tempfile/src/file/imp/other.rs",
    "vendor/tempfile/src/file/imp/unix.rs",
    "vendor/tempfile/src/file/imp/windows.rs",
    "vendor/tempfile/tests/**",
]
SPDX-FileCopyrightText = "2015 Steven Allen"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# rust-lang/literal-escaper v0.0.5 by way of proc-macro2 1.0.106. Neither
# upstream states a copyright line (both LICENSE-MIT files begin at the
# permission notice), so none is given here.
[[annotations]]
path = "vendor/rustc-literal-escaper/**"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The owner's Apache-2.0 projects' NOTICE files, carried verbatim.
[[annotations]]
path = "provenance/upstream-notices/*.NOTICE"
SPDX-FileCopyrightText = "2026 James Beck"
SPDX-License-Identifier = "Apache-2.0"

# sbase's LICENSE, carried verbatim beside userland/PIN.
[[annotations]]
path = "userland/sbase.LICENSE"
SPDX-FileCopyrightText = "2011 Connor Lane Smith, 2011-2016 Dimitris Papastamos, 2014-2016 Laslo Hunhold, and the sbase contributors named in it"
SPDX-License-Identifier = "MIT"

# The LLVM project's LICENSE.TXT (llvmorg-18.1.8), carried verbatim beside
# cxx/PIN. It also reproduces the legacy University of Illinois/NCSA licence
# that LLVM keeps for code contributed before the relicensing.
[[annotations]]
path = "cxx/llvm-project.LICENSE"
SPDX-FileCopyrightText = "The LLVM project contributors (LLVM Project, llvmorg-18.1.8)"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

# The declared patches against llvm-project 18.1.8 (cxx/patches/llvm): LLVM's
# files with ABSD's changes, kept under LLVM's terms as a whole.
[[annotations]]
path = "cxx/patches/llvm/*.patch"
SPDX-FileCopyrightText = "The LLVM project contributors (LLVM Project, llvmorg-18.1.8)"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

# Toybox hexdump source adaptation, kept under its upstream 0BSD terms.
[[annotations]]
path = ["userland/hexdump/hexdump.c", "userland/hexdump/hexdump.patch"]
SPDX-FileCopyrightText = "2021 Moritz Röhrich"
SPDX-License-Identifier = "0BSD"

[[annotations]]
path = ["userland/hexdump/LICENSE", "LICENSES/0BSD.txt"]
SPDX-FileCopyrightText = "2006, 2019 Rob Landley"
SPDX-License-Identifier = "0BSD"
[[annotations]]
path = "userland/patches/tar-absd.patch"
SPDX-FileCopyrightText = "sbase contributors named in userland/sbase.LICENSE"
SPDX-License-Identifier = "MIT"
