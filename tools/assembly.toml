input_sha256 = "e694bcaef86f9f8b1e48483d2eadaa87b8fd99772ca50d054b0d8d367978b660"
text = "Public evidence is archived before exact-key and overlay teardown. The staging_host staging root and evidence disk remain explicitly retained for build_host custody until independent review and the recorded closeout; they are not silently deleted or called absent.\n"

