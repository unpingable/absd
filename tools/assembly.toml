line = 24
input_sha256 = "dc43fb89dd71391706bb655337139ae66ac10facc4262bcd248c229cf0e25d05"
text = "Set `ABSD_APP_A_SSH_TARGET` and `ABSD_APP_A_SSH_IDENTITY` explicitly for the admitted host. There are no lab defaults. The runner disables SSH agents and forwarding, uses only the named identity, and retains batch mode and strict host-key checks. These inputs do not grant execution authority.\n\n```sh\n"
[[source_edit.change]]
line = 36
input_sha256 = "a884f3af82ec3bc2f00792d2fefac13367124ac9668e9dbbc0948bdb9afdb5bd"
text = "After media staging, the runner writes `ADMISSION-REQUEST.json` and waits for the admission file. Admission must name the same run and materialization SHA, a fresh resource sample and launch window, and the unchanged 14,400-second outer contract. The VM is not launched without it. One staging_host `systemd` unit owns the remaining sequence, and the staged executor uses the dispatch's absolute time bounds.\n"
[[source_edit.change]]
