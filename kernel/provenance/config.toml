# Release-readiness configuration for the ABSD kernel (docs/PROVENANCE.md).
# Read by scripts/provenance.py. Edit by hand; keep it small.
#
# Not here: which licence each tracked file is under. That is provenance.toml
# at the repository root, checked by scripts/spdx-check.py
# (docs/SOURCE-LICENSING.md). This file holds the reviewed baseline, the
# policy for third-party dependency licences, and what each artifact contains.

repository = "absd-kernel"
main = "main"

# The reviewed baseline: the tree the 2026-10-10 audit assessed. "Unchanged
# since the baseline" means unchanged since this commit, at the coverage
# stated below, and nothing stronger.
[baseline]
audit = "audit-20261010"
commit = "d55fbec89ab9607bad0f10a061ac5f677eeb4727"
tree = "bc528339944930f27fd9551e7586db4d204d0083"
limits = [
  "The audit was performed by AI model sessions and challenged by one further AI session. It is not a legal review or an independent human source audit.",
  "Comparison used the Linux and FreeBSD trees only, and only for comment phrases, identifiers and function names; a reviewer also read control flow and constants for e1000 and NVMe. It cannot detect logic translated without shared text.",
  "Not compared: any driver against OpenBSD, NetBSD, Redox, SerenityOS, rust-osdev crates, the OSDev wiki or EDK2; the e1000 driver against the MIT-licensed xv6/JOS teaching driver, whose constants a reviewer recalled as similar.",
  "For most drivers the agent records show no upstream source being fetched while they were written. That describes the records; it does not establish originality.",
  "Absence of markers or of textual overlap is not evidence of independent creation. The copyright status of AI-generated code is an open legal question the audit did not resolve.",
]

[[baseline.coverage]]
level = "compared"
paths = ["src/e1000.rs", "src/e1000_ring.rs", "src/nvme.rs", "src/ata.rs", "src/pci.rs", "src/arch/aarch64/virtio.rs", "src/arch/aarch64/nic.rs", "src/arch/aarch64/block.rs", "src/virtio_completion.rs"]
note = "outlined, and compared textually with the Linux and FreeBSD drivers for the same hardware: no shared comment phrase or function name; NVMe register mnemonics coincide with Linux's once prefixed, being the specification's names"

[[baseline.coverage]]
level = "outlined"
paths = ["src/elf.rs", "src/*.S", "src/arch/aarch64/boot.S", "src/arch/aarch64/fdt.rs", "src/nvme_check.rs", "src/block.rs", "src/rtc.rs", "src/serial.rs", "src/topology.rs", "fbcon/*", "build.rs", "Cargo.toml", "Cargo.lock", "linker.ld", "grub.cfg", "scripts/font-8x13.py"]
note = "file head, structure and comments inspected for upstream markers and recognisable tutorial or driver shape, from the reader's recollection of those sources; not read line by line, no mechanical comparison"

[[baseline.coverage]]
level = "sampled"
paths = ["docs/*"]
note = "documents sampled for reproduced external prose"

[[baseline.coverage]]
level = "keyword-sweep"
paths = ["*"]
note = "searched for licence, copyright and upstream markers only; not read line by line, not compared with any upstream"

[target]
triple = "x86_64-unknown-linux-gnu"
names = []

[target.values]
target_arch = "x86_64"

# Third-party licences that may be taken without a further decision, in
# order of preference. This does not choose a licence for ABSD's own code.
[policy]
prefer = ["MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "0BSD", "Zlib", "Unicode-3.0", "Unlicense", "CC0-1.0", "Apache-2.0 WITH LLVM-exception"]

[policy.decisions]

[scan]
binary_ok = ["docs/*"]
path_ok = []

# What a bootable kernel image contains (Makefile `iso` and its variants).
[[artifact]]
name = "kernel-image"

  [[artifact.unit]]
  name = "kernel"
  lock = "Cargo.lock"
  package = "absd-kernel"

  # init and the user programs the kernel embeds or an image carries.
  [[artifact.unit]]
  name = "user"
  lock = "Cargo.lock"
  package = "absd-user"
  manifest_dir = "user"

  [[artifact.component]]
  name = "Rust core, alloc and compiler_builtins"
  version = "toolchain 1.98.0 (rust-toolchain.toml), prebuilt target libraries"
  origin = "toolchain"
  license = "MIT OR Apache-2.0"
  use = "linked"
  source = "linked into the kernel and every user program; compiler_builtins also carries LLVM-derived parts under Apache-2.0 WITH LLVM-exception"
  notice_files = [
    "~/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/share/doc/rust/COPYRIGHT-library.html",
    "~/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/share/doc/rust/licenses",
  ]

  [[artifact.component]]
  name = "X11 misc-fixed 8x13 font"
  version = "font-misc-misc 8x13-ISO8859-1"
  origin = "generated from upstream data"
  license = "public domain"
  use = "linked"
  source = "glyph bytes in fbcon/src/font8x13.rs, generated by scripts/font-8x13.py from the Debian xfonts-base package; provenance.toml classifies the file (generated, upstream terms recorded, first-party part pending)"
  texts = "none required (public domain; stated in the file header)"

  [[artifact.component]]
  name = "GRUB"
  version = "host package grub-common"
  origin = "host-package"
  license = "GPL-3.0-or-later"
  use = "included"
  source = "boot images, modules and locale catalogues copied by grub-mkrescue"
  notice_files = ["/usr/share/doc/grub-common/copyright", "/usr/share/common-licenses/GPL-3"]
  actions = [
    "GPL-3.0: distributing the ISO distributes GRUB binaries; corresponding source for the exact host package build must be offered or accompany it. A notice bundle does not do this.",
    "Record the host package version (dpkg-query -W grub-common grub-pc-bin grub-efi-amd64-bin) with the release; it is not pinned by this repository.",
  ]

  [[artifact.component]]
  name = "GNU Unifont"
  version = "as shipped in host package grub-common (unicode.pf2)"
  origin = "host-package"
  license = "not recorded by the host package (upstream: GPL-2.0-or-later with a font embedding exception; verify for the shipped version)"
  use = "included"
  source = "/usr/share/grub/unicode.pf2 copied by grub-mkrescue"
  notice_files = []
  actions = [
    "Separately licensed font carried on the ISO. The host package's copyright file does not mention it, so no licence text is collected: obtain the text for the shipped version, or build the ISO without the font (grub-mkrescue --fonts=).",
  ]

  [[artifact.component]]
  name = "ABSD platform programs"
  version = "platform repository, pinned commit"
  origin = "first-party"
  license = ""
  use = "included"
  source = "build.rs can embed platform ELFs (file server, SSH server); their third-party content is in the platform repository's provenance/inventory/operator-image.tsv"
