# Release-readiness configuration for the ABSD kernel (docs/PROVENANCE.md).
# Read by scripts/provenance.py. Edit by hand; keep it small.
#
# Not here: which licence each tracked file is under. That is provenance.toml
# at the repository root, checked by scripts/spdx-check.py
# (docs/SOURCE-LICENSING.md). This file holds the reviewed baseline, the
# policy for third-party dependency licences, and what each artifact contains.

repository = "absd-kernel"
main = "main"

# The reviewed baseline: the tree the 2026-10-10 audit assessed. "Unchanged
# since the baseline" means unchanged since this commit, at the coverage
# stated below, and nothing stronger.
[baseline]
audit = "audit-20261010"
commit = "d55fbec89ab9607bad0f10a061ac5f677eeb4727"
tree = "bc528339944930f27fd9551e7586db4d204d0083"
limits = [
  "The audit was performed by AI model sessions and challenged by one further AI session. It is not a legal review or an independent human source audit.",
  "Comparison used the Linux and FreeBSD trees only, and only for comment phrases, identifiers and function names; a reviewer also read control flow and constants for e1000 and NVMe. It cannot detect logic translated without shared text.",
  "Not compared: any driver against OpenBSD, NetBSD, Redox, SerenityOS, rust-osdev crates, the OSDev wiki or EDK2; the e1000 driver against the MIT-licensed xv6/JOS teaching driver, whose constants a reviewer recalled as similar.",
  "For most drivers the agent records show no upstream source being fetched while they were written. That describes the records; it does not establish originality.",
  "Absence of markers or of textual overlap is not evidence of independent creation. The copyright status of AI-generated code is an open legal question the audit did not resolve.",
]

[[baseline.coverage]]
level = "compared"
paths = ["src/e1000.rs", "src/e1000_ring.rs", "src/nvme.rs", "src/ata.rs", "src/pci.rs", "src/arch/aarch64/virtio.rs", "src/arch/aarch64/nic.rs", "src/arch/aarch64/block.rs", "src/virtio_completion.rs"]
note = "outlined, and compared textually with the Linux and FreeBSD drivers for the same hardware: no shared comment phrase or function name; NVMe register mnemonics coincide with Linux's once prefixed, being the specification's names"

[[baseline.coverage]]
level = "outlined"
paths = ["src/elf.rs", "src/*.S", "src/arch/aarch64/boot.S", "src/arch/aarch64/fdt.rs", "src/nvme_check.rs", "src/block.rs", "src/rtc.rs", "src/serial.rs", "src/topology.rs", "fbcon/*", "build.rs", "Cargo.toml", "Cargo.lock", "linker.ld", "grub.cfg", "scripts/font-8x13.py"]
note = "file head, structure and comments inspected for upstream markers and recognisable tutorial or driver shape, from the reader's recollection of those sources; not read line by line, no mechanical comparison"

[[baseline.coverage]]
level = "sampled"
paths = ["docs/*"]
note = "documents sampled for reproduced external prose"

[[baseline.coverage]]
level = "keyword-sweep"
paths = ["*"]
note = "searched for licence, copyright and upstream markers only; not read line by line, not compared with any upstream"

[target]
triple = "x86_64-unknown-linux-gnu"
names = []

[target.values]
target_arch = "x86_64"

# Third-party licences that may be taken without a further decision, in
# order of preference. This does not choose a licence for ABSD's own code.
[policy]
prefer = ["MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "0BSD", "Zlib", "Unicode-3.0", "Unlicense", "CC0-1.0", "Apache-2.0 WITH LLVM-exception"]

[policy.decisions]

[scan]
binary_ok = ["docs/*"]
path_ok = []

# What a bootable kernel image contains (Makefile `iso` and its variants).
[[artifact]]
name = "kernel-image"
# Distributed: the kernel and init a release image carries. Its inventory rows
# used as linked and its components are the shipped closure the licence gate
# audits.
distributed = true

  [[artifact.unit]]
  name = "kernel"
  lock = "Cargo.lock"
  package = "absd-kernel"

  # init and the user programs the kernel embeds or an image carries.
  [[artifact.unit]]
  name = "user"
  lock = "Cargo.lock"
  package = "absd-user"
  manifest_dir = "user"

  [[artifact.component]]
  name = "Rust core, alloc and compiler_builtins"
  version = "toolchain 1.98.0 (rust-toolchain.toml), prebuilt target libraries"
  origin = "toolchain"
  license = "MIT OR Apache-2.0"
  use = "linked"
  source = "linked into the kernel and every user program; compiler_builtins also carries LLVM-derived parts under Apache-2.0 WITH LLVM-exception"
  notice_files = [
    "~/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/share/doc/rust/COPYRIGHT-library.html",
    "~/.rustup/toolchains/1.98.0-x86_64-unknown-linux-gnu/share/doc/rust/licenses",
  ]

  [[artifact.component]]
  name = "X11 misc-fixed 8x13 font"
  version = "font-misc-misc 8x13-ISO8859-1"
  origin = "generated from upstream data"
  license = "LicenseRef-font-misc-misc-public-domain"
  use = "linked"
  source = "glyph bytes in fbcon/src/font8x13.rs, generated by scripts/font-8x13.py from the Debian xfonts-base package; provenance.toml classifies the file (generated, upstream terms recorded, first-party part pending)"
  texts = "none required (public domain; stated in the file header)"

  [[artifact.component]]
  name = "GRUB"
  version = "host package grub-common"
  origin = "host-package"
  license = "GPL-3.0-or-later"
  use = "included"
  source = "boot images, modules and locale catalogues copied by grub-mkrescue"
  notice_files = ["/usr/share/doc/grub-common/copyright", "/usr/share/common-licenses/GPL-3"]
  actions = [
    "GPL-3.0: distributing the ISO distributes GRUB binaries; corresponding source for the exact host package build must be offered or accompany it. A notice bundle does not do this.",
    "Record the host package version (dpkg-query -W grub-common grub-pc-bin grub-efi-amd64-bin) with the release; it is not pinned by this repository.",
  ]

  [[artifact.component]]
  name = "GNU Unifont"
  version = "15.1.01"
  origin = "host-package"
  # Owner election, 2026-10-19, for the exact font identified below, carried
  # into this repository on 2026-10-29 (owner decision): the host's
  # /usr/share/grub/unicode.pf2, which grub-mkrescue copies, was verified to be
  # the elected font (2411806 bytes, the SHA256 below). Upstream COPYING and the
  # compiled font's copyright offer OFL-1.1 as an alternative to
  # GPL-2.0-or-later with the font embedding exception. This component's
  # declared terms record the elected alternative, not terms for its tools.
  license = "OFL-1.1"
  use = "included"
  source = "Unifont 15.1.01 font/precompiled/unifont-15.1.01.pcf.gz, converted by grub-mkfont 2.12-1ubuntu7.3; unicode.pf2 2411806 bytes, SHA256 662eb86fc1ea89635e4bba8413590b79eb714ade5a2b5a5aa3dc5cf5f53a4463"
  notice_files = ["provenance/boot-font/unifont-15.1.01.NOTICE", "LICENSES/OFL-1.1.txt"]
  actions = [
    "OFL-1.1 election applies to the exact 15.1.01 font identified here. Verify each release's actual ISO font against this size and SHA256; changed font bytes require a new source and licence eligibility check before reusing this record.",
    "Distribute the font's copyright notice and the full OFL-1.1 text. Do not apply this font election to Unifont's non-font programs or documentation, and retain OFL conditions for modified fonts and reserved names.",
  ]

  # Not in the default kernel image: build.rs embeds platform ELFs only when
  # ABSD_FILE_SERVER_ELF and the like name them (the platform's operator image
  # does, and audits them there). A build variant this gate does not cover.
  [[artifact.component]]
  name = "ABSD platform programs"
  version = "platform repository, pinned commit"
  origin = "first-party"
  license = ""
  use = "variant"
  source = "build.rs can embed platform ELFs (file server, SSH server); their third-party content is in the platform repository's provenance/inventory/operator-image.tsv"

[[artifact]]
name = "wait-readable-test-fixture"
inventoried = false
distributed = false

  [[artifact.unit]]
  name = "readable-native-probe"
  lock = "tests/fixtures/wait-readable/Cargo.lock"
  package = "readable-native-probe"
  manifest_dir = "tests/fixtures/wait-readable"
  listed = false
  note = "Test-only parent, child and boot_liveness programs; none ships in a distributed artifact. The lock contains readable-native-probe and only the first-party path dependencies absd-user and absd-abi, all at 0.1.0; no registry or third-party packages."

# ---------------------------------------------------------------- licence policy
# The standing licence-policy gate (docs/PROVENANCE.md, "Licence policy gate"),
# run by `provenance.py check` and `full`. Owner policy 2026-10-19: code
# distributed as part of ABSD is permissive only and never LGPL-derived;
# derived code is never labelled Apache-2.0. Owner 2026-10-29: a standing
# process for auditing code by licence. Every licence the records name
# (provenance.toml rules, lock closures, image components, pins, and tags or
# wording in tracked files) must be on `allowed`, or be taken from an OR whose
# alternative is, or be covered by a named exception. A recorded `decision`
# in provenance.toml does not waive it. Keep this table identical to the
# platform repository's, except for paths.
# Owner 2026-11-05 (integration steward): accept SPDX blessing for the pinned
# SQLite core, whose exact dedication the platform carries as
# LICENSES/blessing.txt (sha256 06545a6ec25fbbff6c62f205f94a35be49e38f33bea827a8cfb07d7b82e4b083).
# This adds one identifier; other terms and the sqlite-src mixed tree stay unchanged.
[licence_policy]
# Each entry is permissive and used by one of the two repositories today
# (as of 2026-10-29); the comment names a user. Add one only with a user.
allowed = [
  "MIT",               # most crates; sbase (userland/PIN)
  "Apache-2.0",        # ABSD first-party; Rust std; crates; the owner's projects
  "BSD-3-Clause",      # curve25519/ed25519/x25519-dalek, subtle, encoding_rs; kernel src/i219.rs (Intel)
  "BSD-2-Clause",      # Picolibc headers and sources linked into the userland ports (c/picolibc/PROVENANCE.tsv)
  "ISC",               # ring (with Apache-2.0), rustls-webpki, untrusted, is_ci
  "0BSD",              # smoltcp, managed, sunset; Toybox diff and hexdump
  "Zlib",              # foldhash, zlib-rs
  "blessing",          # SQLite 3.54.0 core and carried clock context; owner 2026-11-05
  "Unicode-3.0",       # icu_* and the zerovec family
  "Unicode-DFS-2016",  # unicode-ident 1.0.13 (with MIT OR Apache-2.0)
  "BSL-1.0",           # clipboard-win, error-code (Boost Software License)
  "Apache-2.0 WITH LLVM-exception",  # compiler_builtins, wasi crates, llvm-project (cxx/PIN), libc++ in the C++ kit
  "LicenseRef-font-misc-misc-public-domain",  # kernel console font (X.Org misc-fixed 8x13) and its component record
]
# Copyleft and source-available families, by SPDX id glob. A term here fails
# even inside an OR, unless another alternative is allowed (that one is then
# taken and the run lists it). WITH never rescues a denied licence. Weak
# copyleft fails by default too. Anything not on `allowed` fails anyway; this
# list names why.
denied = [
  "GPL-*", "LGPL-*", "AGPL-*", "SSPL-*", "EUPL-*", "OSL-*", "CPAL-*", "RPL-*", "RPSL-*", "Sleepycat",
  "MPL-*", "EPL-*", "CDDL-*", "GFDL-*", "CC-BY-SA-*", "CC-BY-NC-*",
]

# Permissive terms awaiting the owner's acceptance would be listed here as
# [[licence_policy.pending]]: each fails the distribution audit as "pending
# owner acceptance" until the owner decides. None is pending.
# Terms the owner accepted for one member table only (decision 2026-10-29,
# record PICOLIBC-LICENCE-TEXTS.md in the latest-integration lane): bound to
# the table, Picolibc 1.8.12 and the pinned tarball's sha256; nowhere else.
# Their conditions are checked against the linked members on every run (the
# table's notice and acknowledgements) and recorded in
# provenance/obligations.toml (LIC-PICOLIBC-NOTICES).
[[licence_policy.accepted]]
licence = "LicenseRef-picolibc-Other-1"
member_table = "c/picolibc/PROVENANCE.tsv"
name = "picolibc"
version = "1.8.12"
source_sha256 = "64e8c412e1c40fa6eb1a72d2b5cdbcbfe6ceca4cbea454edbad54557ffc747fa"
conditions = "preserve this notice: the exact licence text and each linked file's copyright notice in the distribution notices (c/picolibc/NOTICES.txt)"
