# An owner interpretation, not an automatic SPDX match: the one input under
# FreeBSD-1, read as BSD-2-Clause (PICOLIBC-LICENCE-TEXTS.md, second decision).
[[licence_policy.accepted]]
licence = "LicenseRef-picolibc-FreeBSD-1"
member_table = "c/picolibc/PROVENANCE.tsv"
name = "picolibc"
version = "1.8.12"
source_sha256 = "64e8c412e1c40fa6eb1a72d2b5cdbcbfe6ceca4cbea454edbad54557ffc747fa"
inputs = ["libc/include/fenv.h"]
input_sha256 = { "libc/include/fenv.h" = "876d003fe9013e4db147ef9e2471004527084b9b796206e79770d30eb32a24c7" }
interpretation = "BSD-2-Clause"
conditions = "the SiFive copyright notice, the header's grant text and the BSD-2-Clause terms in the distribution notices"
reasoning = "the header grants use 'subject to the terms and conditions of the FreeBSD License' and points to opensource.org/licenses, whose listing names BSD-2-Clause the Simplified BSD or FreeBSD License; the alternative, BSD-2-Clause-Views, adds only a non-binding views disclaimer with the same obligations; the six linked members take only unreferenced declarations from it; it is in no RC2 artifact"
caveat = "Reviewer (Codex, round 2): the header text alone does not uniquely certify the SPDX id (BSD-2-Clause or BSD-2-Clause-Views); this is the owner's interpretation, not a certified match"
review_again_when = "the Picolibc version or this header's bytes change, or a linked member begins to incorporate code from it"
decision = "Owner, 2026-10-29 (second): FreeBSD-1 accepted, interpreted as BSD-2-Clause, scoped to Picolibc 1.8.12 libc/include/fenv.h at the sha256 above (PICOLIBC-LICENCE-TEXTS.md)"

# The only exceptions. Each is bound to exact identities: a component
# exception to the component's name, version, the artifacts it may ship in
# and its source identity (source, equal; or sha256, which the component's
# source states); a path exception to exact paths and the wording families it
# covers there. Nothing else may be added without an owner decision.
[[licence_policy.exception]]
id = "GRUB"
component = "GRUB"
version = "host package grub-common"
artifacts = ["kernel-image"]
source = "boot images, modules and locale catalogues copied by grub-mkrescue"
licence = "GPL-3.0-or-later"
scope = "boot component placed on the ISO by the host's grub-mkrescue; disclosed: its licence text and corresponding source must accompany a distributed ISO (provenance/obligations.toml); no ABSD code links it"
decision = "Owner licence policy 2026-10-19 (GRUB, GPL-3.0+, is a disclosed boot component whose source ships)"

[[licence_policy.exception]]
id = "unifont-font"
component = "GNU Unifont"
version = "15.1.01"
artifacts = ["kernel-image"]
sha256 = "662eb86fc1ea89635e4bba8413590b79eb714ade5a2b5a5aa3dc5cf5f53a4463"
licence = "OFL-1.1"
paths = ["provenance/boot-font/unifont-15.1.01.NOTICE", "LICENSES/OFL-1.1.txt"]
markers = ["gpl"]
scope = "the compiled Unifont 15.1.01 boot font only (unicode.pf2, SHA256 662eb86f...), under the elected OFL-1.1 alternative; Unifont's GPL programs and documentation are not distributed; the NOTICE quotes the alternative not elected"
decision = "Owner, 2026-10-19: elect OFL-1.1 for the exact RC1 font (provenance.toml boot-font rule; carried into this repository 2026-10-29)"

# The SPDX licence library the gate validates every expression with: a
# versioned policy input, not a routine tool. Its wheels' sha256, its version
# and the SPDX licence list version it embeds define which identifiers the
# gate recognises; changing any of them is a policy change that `check`
# reports for review until `decision` names the new license_expression wheel
# sha256. The wheels are host tooling (not in the source tree), looked up in
# $ABSD_PROVENANCE_WHEELS or ~/.cache/absd/provenance-wheels.
[licence_policy.spdx_library]
license_expression_version = "30.4.1"
boolean_py_version = "5.0"
spdx_license_list_version = "3.26"
license_index_sha256 = "fada395d3ec3f960cd39a69b3e82f44ff8d13550965b0a43bca01e5157dd9edc"
decision = "Owner direction 2026-10-29: adopt license-expression 30.4.1 (wheel 679646bc3261a17690494a3e1cada446e5ee342dbd87dcfa4a0c24cc5dce13ee) with boolean.py 5.0, SPDX licence list 3.26"

[licence_policy.spdx_library.wheels]
"license_expression-30.4.1-py3-none-any.whl" = "679646bc3261a17690494a3e1cada446e5ee342dbd87dcfa4a0c24cc5dce13ee"
"boolean_py-5.0-py3-none-any.whl" = "ef28a70bd43115208441b53a045d1549e2f0ec6e3d08a9d142cbc41c1938e8d9"

# Which proof obligations gate the claim is fixed in scripts/provenance.py,
# not configured (review round 3, owner stopping rule): O1 strict expression
# parsing with the verified wheels and G3 exact byte comparisons gate; O2-O5,
# collector completeness and SPDX database consistency are report-only and
# listed UNVERIFIED on every run (docs/PROVENANCE.md).

# Pinned upstream inputs that are not Cargo crates: the kernel has none.

# Build variants the gate does not cover: refused while selected. The kernel
# image built with platform programs embedded is the platform's operator
# image, audited by the platform repository's gate.
[[licence_policy.variant]]
name = "kernel image with embedded platform programs"
env = ["ABSD_FILE_SERVER_ELF", "ABSD_EXTERNAL_USER_ELF", "ABSD_EXTERNAL_READER_ELF", "ABSD_PORTABILITY_ELF", "ABSD_OWNER_1_ELF", "ABSD_OWNER_2_ELF", "ABSD_OWNER_3_ELF", "ABSD_OWNER_4_ELF"]
reason = "build.rs embeds the named ELFs; their closure is the platform repository's operator-image audit"

# Held out of distribution (owner decision 2026-10-29) pending its own review.
[[licence_policy.held]]
name = "YY3568 device tree (rk3568-yy3568.dtb, compiled from Armbian sources)"
licence = "GPL-2.0-only (its dt-bindings inputs)"
reason = "needed to boot the YY3568 first-light image; not in this repository or any release artifact (docs/arm64-first-light/README.md)"
decision = "Owner, 2026-10-29: YY3568 device-tree artifacts stay out of distribution pending their own review"

# Host tools (README.md "Prerequisites"): run on the build or test host, never
# distributed. Distributing one is a separate decision with these obligations.
[[licence_policy.host_tool]]
name = "license-expression 30.4.1 and boolean.py 5.0 (pinned wheels)"
licence = "Apache-2.0 AND BSD-2-Clause; the embedded licence database is CC-BY-4.0"
use = "the licence gate parses and validates every SPDX expression with them ([licence_policy.spdx_library])"
obligation = "none while only run; they are not in the source tree or any image"

[[licence_policy.host_tool]]
name = "QEMU (qemu-system-x86_64, qemu-system-aarch64)"
licence = "GPL-2.0-only"
use = "boots the test images of make check"
obligation = "none while only run; shipping it would require corresponding source and its licence texts"

[[licence_policy.host_tool]]
name = "grub-mkrescue, xorriso"
licence = "GPL-3.0-or-later"
use = "assemble the ISO (GRUB's own binaries on it are the GRUB exception)"
obligation = "none for the tools themselves; GRUB's binaries on the ISO carry the GRUB exception's obligations"

[[licence_policy.host_tool]]
name = "C toolchain linker (cc/ld) and Rust 1.98.0"
licence = "GPL-3.0-or-later WITH GCC-exception-3.1 (binutils ld GPL-3.0-or-later); Rust MIT OR Apache-2.0"
use = "build the kernel and user programs; Rust core, alloc and compiler_builtins are a component of the image"
obligation = "none for the tools; the linked Rust libraries' notices (provenance/obligations.toml)"

# Files whose licence wording is not scanned (d), each with the reason.
# Records the gate reads structurally are here; so are documents that only
# discuss the policy. Not a directory skip: name files.
# record = true: a record the gate reads structurally, whose wording is not
# listed again. Otherwise the file only discusses licences (owner decision
# 2026-10-29): its wording is listed in the inventory, not failed. Licence
# tags are judged in every file whatever this list says.
[[licence_policy.marker_exempt]]
path = "provenance.toml"
