# The provenance tools are one implementation in the kernel and platform
# repositories. Both configurations pin the same sha256; scripts/provenance.py
# check fails on drift, so the files and both pins change together.
[shared_tools]
# `full` refuses to pass without the other repository (--peer DIR or
# $ABSD_PROVENANCE_PEER): the pins below must equal the peer's, file for file.
peer_required = true

